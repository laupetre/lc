name: Deploy full stack (infra → api → swa)

on:
  push:
    branches: [ "main" ]
    paths:
      - "infra/**"
      - "api/**"
      - "web/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: prod-deploy-refs/heads/main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  infra:
    uses: ./.github/workflows/infra_apply.yml
    with:
      tf_dir: infra

      # tfstate backend
      backend_rg: tfstate-rg
      backend_sa: tfstatelaupetrelc
      backend_container: tfstate
      backend_key: prod.terraform.tfstate

      # infra names (used for guarded imports)
      rg_name: lc-swa-rg
      env_name: lc-swa-env
      acr_name: lcacrio
      law_name: lc-swa-rg-law
      swa_name: lc-swa-web
      app_name: lc-swa-api 
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # (Optional) downstream jobs can consume outputs from "infra" if needed, e.g.:
  # api:
  #   needs: infra
  #   uses: ./.github/workflows/api_deploy.yml
  #   with:
  #     acr_login_server: ${{ needs.infra.outputs.acr_login_server }}
  #   secrets: inherit
  #
  # web:
  #   needs: [infra, api]
  #   uses: ./.github/workflows/swa_deploy.yml
  #   with:
  #     swa_token: ${{ needs.infra.outputs.swa_token }}
  #   secrets: inherit
