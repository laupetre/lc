name: Deploy full stack (infra → api → swa)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: Infra
    uses: ./.github/workflows/infra_apply.yml
    with:
      tf_dir: infra
    secrets: inherit

  api:
    name: Deploy API
    needs: infra
    uses: ./.github/workflows/api_deploy.yml
    secrets: inherit

  swa:
    name: Deploy SWA
    needs: [infra, api]
    uses: ./.github/workflows/swa_deploy.yml
    with:
      api_base_url:   ${{ needs.infra.outputs.api_url }}
      swa_deploy_token: ${{ needs.infra.outputs.swa_token }}   # <-- NEW
    secrets: inherit
