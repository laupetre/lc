name: Deploy Stack

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Azure region for core resources"
        required: true
        default: eastus
      swa_location:
        description: "Azure region for Static Web Apps"
        required: true
        default: eastus2
      resource_group_name:
        description: "Resource group name"
        required: true
        default: lc-swa-rg
      acr_name:
        description: "Azure Container Registry name"
        required: true
        default: lcacrio
      containerapps_env_name:
        description: "Container Apps Environment name"
        required: true
        default: lc-swa-env
      containerapp_name:
        description: "Container App name"
        required: true
        default: lc-swa-api
      container_port:
        description: "Container port"
        required: true
        default: "8080"
      image_name:
        description: "Image repo/name (no registry)"
        required: true
        default: lc-swa-api
      image_tag:
        description: "Image tag"
        required: true
        default: latest
      bootstrap_image:
        description: "Bootstrap image for first deploy (if needed)"
        required: true
        default: mcr.microsoft.com/azuredocs/aci-helloworld:latest

jobs:
  deploy:
    uses: ./.github/workflows/deploy_env.yml
    with:
      location: ${{ github.event.inputs.location }}
      swa_location: ${{ github.event.inputs.swa_location }}
      resource_group_name: ${{ github.event.inputs.resource_group_name }}
      acr_name: ${{ github.event.inputs.acr_name }}
      containerapps_env_name: ${{ github.event.inputs.containerapps_env_name }}
      containerapp_name: ${{ github.event.inputs.containerapp_name }}
      container_port: ${{ github.event.inputs.container_port }}
      image_name: ${{ github.event.inputs.image_name }}
      image_tag: ${{ github.event.inputs.image_tag }}
      bootstrap_image: ${{ github.event.inputs.bootstrap_image }}
    secrets: inherit
