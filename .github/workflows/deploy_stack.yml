name: Deploy full stack (infra → api → swa)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "infra/**"
      - "api/**"
      - "web/**"
      - ".github/workflows/**"

concurrency:
  group: prod-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  infra:
    name: Infra
    uses: ./.github/workflows/infra_apply.yml
    secrets: inherit

  api:
    name: API
    needs: infra
    uses: ./.github/workflows/api_deploy.yml
    with:
      rg_name:            "lc-swa-rg"
      containerapp_name:  "lc-swa-api"
      # pass the login server from infra outputs (e.g. lcacrio.azurecr.io)
      acr_login_server:   ${{ needs.infra.outputs.acr_login_server }}
      image_name:         "lc-swa-api"
      context_dir:        "api"
    secrets: inherit

  swa:
    name: SWA
    needs: infra
    uses: ./.github/workflows/swa_deploy.yml
    with:
      app_location:    "web"
      output_location: "web"
    secrets:
      SWA_DEPLOYMENT_TOKEN: ${{ needs.infra.outputs.swa_token }}
