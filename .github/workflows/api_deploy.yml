name: Deploy API

on:
  workflow_call:
    inputs:
      rg_name:              { type: string, required: true }
      containerapp_name:    { type: string, required: true }
      acr_name:             { type: string, required: true }
      image_name:           { type: string, required: true, default: "lc-swa-api" }
      context_dir:          { type: string, required: false, default: "api" }
  push:
    paths:
      - "api/**"
      - ".github/workflows/api_deploy.yml"
    branches: [ main ]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push API image to ACR
        env:
          ACR_NAME:  ${{ inputs.acr_name }}
          IMAGE:     ${{ inputs.image_name }}
          CONTEXT:   ${{ inputs.context_dir }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker build -t $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }} -t $ACR_NAME.azurecr.io/$IMAGE:latest "$CONTEXT"
          docker push  $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}
          docker push  $ACR_NAME.azurecr.io/$IMAGE:latest

      - name: Update Container App image
        env:
          RG:   ${{ inputs.rg_name }}
          APP:  ${{ inputs.containerapp_name }}
          ACR:  ${{ inputs.acr_name }}
          IMG:  ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/$IMG:${{ github.sha }}"
