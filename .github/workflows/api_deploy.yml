name: Deploy API

on:
  workflow_call:
    inputs:
      rg_name:            { type: string, required: true }
      containerapp_name:  { type: string, required: true }
      # pass the full login server (e.g. lcacrio.azurecr.io) from infra
      acr_login_server:   { type: string, required: true }
      image_name:         { type: string, required: true, default: "lc-swa-api" }
      context_dir:        { type: string, required: false, default: "api" }
  push:
    paths:
      - "api/**"
      - ".github/workflows/api_deploy.yml"
    branches: [ main ]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push API image to ACR
        env:
          ACR_LOGIN_SERVER: ${{ inputs.acr_login_server }}   # e.g. lcacrio.azurecr.io
          IMAGE:            ${{ inputs.image_name }}
          CONTEXT:          ${{ inputs.context_dir }}
        run: |
          set -euo pipefail

          # Derive the bare registry name for 'az acr login'
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"   # lcacrio.azurecr.io -> lcacrio

          # Login to ACR
          az acr login --name "$ACR_NAME"

          # Build & push (use the full login server in the tag)
          docker build -t $ACR_LOGIN_SERVER/$IMAGE:${{ github.sha }} \
                       -t $ACR_LOGIN_SERVER/$IMAGE:latest "$CONTEXT"
          docker push  $ACR_LOGIN_SERVER/$IMAGE:${{ github.sha }}
          docker push  $ACR_LOGIN_SERVER/$IMAGE:latest

      - name: Update Container App image
        env:
          RG:               ${{ inputs.rg_name }}
          APP:              ${{ inputs.containerapp_name }}
          ACR_LOGIN_SERVER: ${{ inputs.acr_login_server }}
          IMG:              ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR_LOGIN_SERVER/$IMG:${{ github.sha }}"
