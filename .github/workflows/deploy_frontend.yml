# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches:
      - main
      - preprod
    paths:
      - "web/**"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (preprod or prod)'
        required: true
        type: choice
        options:
          - preprod
          - prod
  workflow_run:
    workflows: [ "Deploy API (Azure Container Apps)" ]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_name }}" == "preprod" ]; then
            # Deploy to preprod when pushing to preprod branch
            ENV="preprod"
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            # For workflow_run events, check the head branch of the triggering workflow
            if [ "${{ github.event.workflow_run.head_branch }}" == "preprod" ]; then
              ENV="preprod"
            else
              ENV="prod"
            fi
          else
            # Default to prod for main branch and other events
            ENV="prod"
          fi
          echo "ENVIRONMENT=$ENV" >> $GITHUB_OUTPUT
          echo "Using environment: $ENV (event: ${{ github.event_name }}, branch: ${{ github.ref_name }})"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read deploy.json
        id: cfg
        run: |
          DEPLOY_FILE="deploy.${{ steps.env.outputs.ENVIRONMENT }}.json"
          if [ ! -f "$DEPLOY_FILE" ]; then
            echo "Error: $DEPLOY_FILE not found"
            exit 1
          fi
          RG=$(jq -r .resource_group "$DEPLOY_FILE")
          ENV=$(jq -r .containerapps_env "$DEPLOY_FILE")
          ACA=$(jq -r .aca_name "$DEPLOY_FILE")
          SWA=$(jq -r .swa_name "$DEPLOY_FILE")
          echo "RG=$RG"   >> $GITHUB_OUTPUT
          echo "ENV=$ENV" >> $GITHUB_OUTPUT
          echo "ACA=$ACA" >> $GITHUB_OUTPUT
          echo "SWA=$SWA" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC) - for hostname discovery
        uses: azure/login@v2
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Get Static Web App deployment token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list -n "${{ steps.cfg.outputs.SWA }}" -g "${{ steps.cfg.outputs.RG }}" --query "properties.apiKey" -o tsv)
          echo "SWA_TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Check resource group exists
        run: |
          if ! az group show -n "${{ steps.cfg.outputs.RG }}" >/dev/null 2>&1; then
            echo "Resource group '${{ steps.cfg.outputs.RG }}' not found. Run the Terraform infra workflow (terraform_infra.yml) or create the RG before deploying the frontend."
            exit 1
          fi

      - name: Resolve ACA FQDN (from Azure)
        id: aca
        run: |
          FQDN=$(az containerapp show -n "${{ steps.cfg.outputs.ACA }}" -g "${{ steps.cfg.outputs.RG }}" --query properties.configuration.ingress.fqdn -o tsv || true)
          if [ -z "$FQDN" ]; then
            echo "Could not resolve container app FQDN for '${{ steps.cfg.outputs.ACA }}' in resource group '${{ steps.cfg.outputs.RG }}'. Ensure the Container App exists or run the infra workflow."
            exit 1
          fi
          echo "FQDN=$FQDN" >> $GITHUB_OUTPUT

      - name: Bake config.js (point to ACA)
        run: |
          API_BASE="https://${{ steps.aca.outputs.FQDN }}"
          sed "s|__API_BASE__|$API_BASE|g" web/config.template.js > web/config.js
          echo "Using API_BASE: $API_BASE"
          echo "Files in web/ directory:"
          ls -la web/
          echo ""
          echo "Config.js content:"
          cat web/config.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ steps.swa_token.outputs.SWA_TOKEN }}"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          action: "upload"
          app_location: "web/"
          output_location: "web/"
        env:
          NODE_VERSION: 18
