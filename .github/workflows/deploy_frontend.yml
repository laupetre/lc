name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "style.css"
      - "config.template.js"
      - ".github/workflows/deploy_frontend.yml"
      - "deploy.json"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read deploy.json
        id: cfg
        run: |
          RG=$(jq -r .resource_group deploy.json)
          ENV=$(jq -r .containerapps_env deploy.json)
          ACA=$(jq -r .aca_name deploy.json)
          SWA=$(jq -r .swa_name deploy.json)
          echo "RG=$RG"   >> $GITHUB_OUTPUT
          echo "ENV=$ENV" >> $GITHUB_OUTPUT
          echo "ACA=$ACA" >> $GITHUB_OUTPUT
          echo "SWA=$SWA" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC) - for hostname discovery
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACA FQDN (from Azure)
        id: aca
        run: |
          FQDN=$(az containerapp show -n "${{ steps.cfg.outputs.ACA }}" -g "${{ steps.cfg.outputs.RG }}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "FQDN=$FQDN" >> $GITHUB_OUTPUT

      - name: Bake config.js (point to ACA)
        run: |
          API_BASE="https://${{ steps.aca.outputs.FQDN }}"
          sed "s|__API_BASE__|$API_BASE|g" config.template.js > config.js
          echo "Using API_BASE: $API_BASE"
          ls -la

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "/"
        env:
          NODE_VERSION: 18
