# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy API (Azure Container Apps)

on:
  push:
    branches: 
      - main
      - preprod
    paths:
      - "api/**"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (preprod or prod)'
        required: true
        type: choice
        options:
          - preprod
          - prod
  workflow_run:
    workflows: [ "Terraform Infra" ]
    types:
      - completed

permissions:
  id-token: write   # REQUIRED for Azure OIDC
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" == "preprod" ]; then
            # Deploy to preprod when pushing to preprod branch
            ENV="preprod"
          else
            # Default to prod for main branch and other pushes
            ENV="prod"
          fi
          echo "ENVIRONMENT=$ENV" >> $GITHUB_OUTPUT
          echo "Using environment: $ENV (branch: ${{ github.ref_name }})"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read deploy.json
        id: cfg
        run: |
          DEPLOY_FILE="deploy.${{ steps.env.outputs.ENVIRONMENT }}.json"
          if [ ! -f "$DEPLOY_FILE" ]; then
            echo "Error: $DEPLOY_FILE not found"
            exit 1
          fi
          RG=$(jq -r .resource_group "$DEPLOY_FILE")
          ACR=$(jq -r .acr_name "$DEPLOY_FILE")
          ACA=$(jq -r .aca_name "$DEPLOY_FILE")
          SWA=$(jq -r .swa_name "$DEPLOY_FILE")
          echo "RG=$RG"   >> $GITHUB_OUTPUT
          echo "ACR=$ACR" >> $GITHUB_OUTPUT
          echo "ACA=$ACA" >> $GITHUB_OUTPUT
          echo "SWA=$SWA" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Check resource group exists
        run: |
          if ! az group show -n "${{ steps.cfg.outputs.RG }}" >/dev/null 2>&1; then
            echo "Resource group '${{ steps.cfg.outputs.RG }}' not found. Run the Terraform infra workflow (terraform_infra.yml) or create the RG before deploying the API."
            exit 1
          fi

      - name: Resolve SWA default hostname (from Azure)
        id: swa
        run: |
          HN=$(az staticwebapp show -n "${{ steps.cfg.outputs.SWA }}" -g "${{ steps.cfg.outputs.RG }}" --query defaultHostname -o tsv || true)
          if [ -z "$HN" ]; then
            echo "Could not resolve Static Web App hostname for '${{ steps.cfg.outputs.SWA }}' in resource group '${{ steps.cfg.outputs.RG }}'. Ensure the SWA exists or run the infra workflow."
            exit 1
          fi
          echo "HOSTNAME=$HN" >> $GITHUB_OUTPUT

      - name: ACR Login
        run: az acr login --name ${{ steps.cfg.outputs.ACR }}

      - name: Build & Push image
        run: |
          IMG="${{ steps.cfg.outputs.ACR }}.azurecr.io/langchain-chat-api:${{ github.sha }}"
          docker build -t "$IMG" api/
          docker push "$IMG"
        env:
          DOCKER_BUILDKIT: 1

      - name: Deploy to Azure Container Apps
        run: |
          IMG="${{ steps.cfg.outputs.ACR }}.azurecr.io/langchain-chat-api:${{ github.sha }}"
          az containerapp update \
            --name "${{ steps.cfg.outputs.ACA }}" \
            --resource-group "${{ steps.cfg.outputs.RG }}" \
            --image "$IMG" \
            --set-env-vars "OPENAI_MODEL=gpt-4o-mini" "ALLOWED_ORIGIN=https://${{ steps.swa.outputs.HOSTNAME }}"
