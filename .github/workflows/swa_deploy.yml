name: Deploy SWA

on:
  workflow_call:
    inputs:
      api_base_url:
        description: "API base URL to inject into the web app"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL to inject into the web app"
        required: true
        type: string

# Different group from parent to avoid deadlock
concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_LOCATION: web
  OUTPUT_LOCATION: dist

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inject API URL into web/config.js
        run: |
          mkdir -p $APP_LOCATION
          echo "window.__API_BASE__ = '${{ inputs.api_base_url }}';" > $APP_LOCATION/config.js
          cat $APP_LOCATION/config.js

      - name: Build (example npm)
        working-directory: ${{ env.APP_LOCATION }}
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            mkdir -p ../${OUTPUT_LOCATION}
            cp -r . ../${OUTPUT_LOCATION}/
          fi

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ${{ env.APP_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
