name: Deploy Static Web App

on:
  workflow_call:
    inputs:
      app_location:   { type: string, required: false, default: "web" }
      output_location:{ type: string, required: false, default: "web" }
    secrets:
      SWA_DEPLOYMENT_TOKEN:
        required: true
  push:
    paths:
      - "web/**"
      - ".github/workflows/swa_deploy.yml"
    branches: [ main ]

concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          app_location:   ${{ inputs.app_location }}
          output_location:${{ inputs.output_location }}
