name: Deploy Static Web App (frontend)

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/swa_deploy.yml'
  workflow_dispatch:

# Adjust these if your RG/app names differ
env:
  AZURE_RESOURCE_GROUP: lc-swa-rg
  CONTAINERAPP_NAME: lc-swa-api

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Login only to read the Container App FQDN
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set subscription
        shell: bash
        run: |
          SUB_ID=$(jq -r '.subscriptionId' <<< '${{ secrets.AZURE_CREDENTIALS }}')
          az account set --subscription "$SUB_ID"
          az account show -o table

      - name: Fetch API URL from Container Apps
        id: api
        shell: bash
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
                  --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -n "$FQDN" ]; then
            echo "api_url=https://$FQDN" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=" >> "$GITHUB_OUTPUT"
            echo "No live Container App FQDN found; will try fallback secret."
          fi

      - name: Resolve API URL (prefer live, else secret)
        id: resolve
        shell: bash
        env:
          LIVE_URL: ${{ steps.api.outputs.api_url }}
          SECRET_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          API_URL="${LIVE_URL:-$SECRET_URL}"
          if [ -z "$API_URL" ]; then
            echo "::error::API URL not found. Ensure the API workflow has deployed, or set secrets.API_BASE_URL."
            exit 1
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "Using API_URL=$API_URL"

      # Inject API URL into your static site
      # If you have a template at web/config.template.js with placeholder __API_BASE__,
      # we'll render web/config.js. Otherwise we create a simple config.js.
      - name: Inject API URL into config.js
        shell: bash
        env:
          API_URL: ${{ steps.resolve.outputs.api_url }}
        run: |
          if [ -f web/config.template.js ]; then
            sed "s#__API_BASE__#${API_URL}#g" web/config.template.js > web/config.js
          else
            mkdir -p web
            echo "export const API_BASE_URL='${API_URL}';" > web/config.js
          fi
          head -n 1 web/config.js || true

      # If you build (npm/yarn) add steps here to produce a "dist" folder and set output_location: dist
      - name: Deploy SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: ""
