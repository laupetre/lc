# .github/workflows/swa_deploy.yml
name: Deploy Static Web App (frontend)

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/swa_deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create RG
        run: az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION"

      - name: Ensure ACR
        run: az acr create -g "$AZURE_RESOURCE_GROUP" -n "$ACR_NAME" --sku Basic --only-show-errors || true

      - name: ACR login (AAD)
        run: az acr login -n "$ACR_NAME"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest