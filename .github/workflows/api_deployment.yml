name: Deploy API

on:
  workflow_call:
  workflow_dispatch:

# Different group from parent to avoid deadlock
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RG_NAME: lc-swa-rg
  CONTAINERAPP_NAME: lc-swa-api
  ACR_NAME: lcacrio
  IMAGE_NAME: lc-swa-api
  OPENAI_MODEL: gpt-4o-mini

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image
        run: |
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA} ./api

      - name: ACR login & push
        run: |
          az acr login --name $ACR_NAME
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}

      - name: Update Container App to new image
        run: |
          az containerapp update \
            -g "$RG_NAME" \
            -n "$CONTAINERAPP_NAME" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}" \
            --set-env-vars OPENAI_MODEL="$OPENAI_MODEL"
