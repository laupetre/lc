name: Deploy API (Container Apps)

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/api_deployment.yml'
  workflow_dispatch:

# ----- Configure defaults (ACR_NAME must be globally unique, letters/numbers only) -----
env:
  AZURE_RESOURCE_GROUP: lc-swa-rg
  AZURE_LOCATION: eastus
  ACR_NAME: lcacrio                 # <- per your preference
  CONTAINERAPPS_ENV: lc-swa-env
  CONTAINERAPP_NAME: lc-swa-api
  IMAGE_NAME: lc-swa-api
  OPENAI_MODEL: gpt-4o-mini

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}   # SP JSON from: az ad sp create-for-rbac --sdk-auth

      - name: Set subscription
        shell: bash
        run: |
          SUB_ID=$(jq -r '.subscriptionId' <<< '${{ secrets.AZURE_CREDENTIALS }}')
          az account set --subscription "$SUB_ID"
          az account show -o table

      # ---------- Register required resource providers (idempotent) ----------
      - name: Register resource providers
        shell: bash
        run: |
          set -euo pipefail
          for NS in Microsoft.ContainerRegistry Microsoft.App Microsoft.OperationalInsights; do
            echo "Ensuring $NS is Registered..."
            az provider register --namespace "$NS" >/dev/null 2>&1 || true
            for _ in {1..30}; do
              STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo NotRegistered)
              echo "  $NS: $STATE"
              [ "$STATE" = "Registered" ] && break || sleep 5
            done
            FINAL=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo NotRegistered)
            [ "$FINAL" = "Registered" ] || { echo "::error::$NS not registered"; exit 1; }
          done

      - name: Create/ensure Resource Group
        run: az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION"

      # ---------- ACR (create if missing; poll until Succeeded) ----------
      - name: Ensure ACR exists
        shell: bash
        run: |
          set -euo pipefail
          if ! az acr show -n "$ACR_NAME" --query name -o tsv >/dev/null 2>&1; then
            echo "Creating ACR $ACR_NAME in $AZURE_RESOURCE_GROUP/$AZURE_LOCATION..."
            az acr create -g "$AZURE_RESOURCE_GROUP" -n "$ACR_NAME" -l "$AZURE_LOCATION" --sku Basic --only-show-errors
          else
            echo "ACR $ACR_NAME already exists."
          fi
          echo "Waiting for ACR provisioning to finish..."
          for _ in {1..60}; do
            STATE=$(az acr show -n "$ACR_NAME" --query provisioningState -o tsv 2>/dev/null || echo Creating)
            echo "  provisioningState=$STATE"
            [ "$STATE" = "Succeeded" ] && break || sleep 5
          done
          [ "$STATE" = "Succeeded" ] || { echo "::error::ACR did not reach Succeeded"; exit 1; }
          az acr show -n "$ACR_NAME" --query "{loginServer:loginServer,sku:sku.name}" -o tsv

      - name: ACR login (AAD)
        run: az acr login -n "$ACR_NAME"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # ---------- Container Apps ----------
      - name: Setup Container Apps
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade
          az containerapp env create -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPPS_ENV" -l "$AZURE_LOCATION" || true

      - name: Create/Update Container App
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SWA_URL: ${{ secrets.SWA_URL }}     # optional: lock CORS to your SWA domain
        run: |
          set -euo pipefail
          ALLOWED="${SWA_URL:-*}"
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:latest"
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"

          if az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" >/dev/null 2>&1; then
            echo "App exists — ensure registry + update image/env..."
            az containerapp registry set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --server "$ACR_NAME.azurecr.io" --identity system

            # Ensure AcrPull for the app's identity
            ACR_ID=$(az acr show -g "$AZURE_RESOURCE_GROUP" -n "$ACR_NAME" --query id -o tsv)
            APP_PID=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query identity.principalId -o tsv)
            az role assignment create --assignee "$APP_PID" --role AcrPull --scope "$ACR_ID" >/dev/null 2>&1 || true

            az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --image "$IMAGE" \
              --set-env-vars OPENAI_MODEL="$OPENAI_MODEL" ALLOWED_ORIGIN="$ALLOWED"
          else
            echo "Creating app with public image first (no ACR auth needed)..."
            az containerapp create -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --environment "$CONTAINERAPPS_ENV" \
              --ingress external --target-port 8000 \
              --image "$PLACEHOLDER" \
              --system-assigned \
              --env-vars OPENAI_MODEL="$OPENAI_MODEL" ALLOWED_ORIGIN="$ALLOWED"

            echo "Link ACR using system identity..."
            az containerapp registry set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --server "$ACR_NAME.azurecr.io" --identity system

            echo "Grant AcrPull to the app identity..."
            ACR_ID=$(az acr show -g "$AZURE_RESOURCE_GROUP" -n "$ACR_NAME" --query id -o tsv)
            APP_PID=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query identity.principalId -o tsv)
            az role assignment create --assignee "$APP_PID" --role AcrPull --scope "$ACR_ID" >/dev/null 2>&1 || true

            echo "Switch to your private image..."
            az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --image "$IMAGE"
          fi

          # Secret for OpenAI API key, then reference via env
          az containerapp secret set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
            --secrets openai-key="$OPENAI_API_KEY"
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
            --set-env-vars OPENAI_API_KEY=secretref:openai-key

      - name: Output API URL
        id: out
        shell: bash
        run: |
          FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API_URL=https://$FQDN"
          echo "api_url=https://$FQDN" >> "$GITHUB_OUTPUT"
