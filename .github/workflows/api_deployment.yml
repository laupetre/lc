name: Deploy API (Container Apps)

on:
  workflow_call:
    inputs:
      cleanup:
        required: false
        type: string
        default: "none"      # none | revisions | full
      keep:
        required: false
        type: string
        default: "5"
  workflow_dispatch:
    inputs:
      cleanup:
        description: "none | revisions | full"
        required: false
        default: "none"
        type: choice
        options: [none, revisions, full]
      keep:
        description: "Keep N inactive revisions"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: prod-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: lc-swa-rg
  AZURE_LOCATION: eastus
  ACR_NAME: lcacrio
  CONTAINERAPPS_ENV: lc-swa-env
  CONTAINERAPP_NAME: lc-swa-api
  IMAGE_NAME: lc-swa-api
  OPENAI_MODEL: gpt-4o-mini
  LA_WORKSPACE_NAME: lc-swa-law

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Service Principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Derive cleanup options
        id: cargs
        run: |
          echo "cleanup=${{ inputs.cleanup || 'none' }}" >> $GITHUB_OUTPUT
          echo "keep=${{ inputs.keep || '5' }}"         >> $GITHUB_OUTPUT

      - name: Register providers
        run: |
          for NS in Microsoft.ContainerRegistry Microsoft.App Microsoft.OperationalInsights; do
            az provider register --namespace "$NS" >/dev/null 2>&1 || true
          done

      - name: Ensure RG, ACR, LAW
        run: |
          az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION"
          if ! az acr show -n "$ACR_NAME" >/dev/null 2>&1; then
            az acr create -g "$AZURE_RESOURCE_GROUP" -n "$ACR_NAME" -l "$AZURE_LOCATION" --sku Basic
          fi
          if ! az monitor log-analytics workspace show -g "$AZURE_RESOURCE_GROUP" -n "$LA_WORKSPACE_NAME" >/dev/null 2>&1; then
            az monitor log-analytics workspace create -g "$AZURE_RESOURCE_GROUP" -n "$LA_WORKSPACE_NAME" -l "$AZURE_LOCATION"
          fi

      - name: ACR login (AAD)
        run: az acr login -n "$ACR_NAME"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Ensure Container Apps Env
        run: |
          az extension add --name containerapp --upgrade
          LAW_ID=$(az monitor log-analytics workspace show -g "$AZURE_RESOURCE_GROUP" -n "$LA_WORKSPACE_NAME" --query customerId -o tsv)
          LAW_KEY=$(az monitor log-analytics workspace get-shared-keys -g "$AZURE_RESOURCE_GROUP" -n "$LA_WORKSPACE_NAME" --query primarySharedKey -o tsv)
          az containerapp env create -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPPS_ENV" -l "$AZURE_LOCATION" \
            --logs-workspace-id "$LAW_ID" --logs-workspace-key "$LAW_KEY" >/dev/null || true

      - name: Optional cleanup
        if: ${{ steps.cargs.outputs.cleanup != 'none' }}
        env:
          CLEANUP: ${{ steps.cargs.outputs.cleanup }}
          KEEP_N:  ${{ steps.cargs.outputs.keep }}
        run: |
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --revision-mode Single >/dev/null 2>&1 || true
          if az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" >/dev/null 2>&1; then
            if [ "$CLEANUP" = "revisions" ] || [ "$CLEANUP" = "full" ]; then
              mapfile -t INACTIVE < <(az containerapp revision list -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query "[?active==\`false\`].name" -o tsv | tac)
              COUNT=${#INACTIVE[@]}
              if [ "$COUNT" -gt "$KEEP_N" ]; then
                TO_DELETE=$((COUNT-KEEP_N)); idx=0
                for rev in "${INACTIVE[@]}"; do
                  idx=$((idx+1)); [ "$idx" -le "$TO_DELETE" ] || break
                  az containerapp revision delete -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --revision "$rev" --yes || true
                done
              fi
            fi
          fi
          if [ "$CLEANUP" = "full" ]; then
            mapfile -t MANIFESTS < <(az acr repository show-manifests -n "$ACR_NAME" --repository "$IMAGE_NAME" --query "[?tags==null].digest" -o tsv 2>/dev/null || echo "")
            for dg in "${MANIFESTS[@]}"; do
              [ -n "$dg" ] || continue
              az acr repository delete -n "$ACR_NAME" --image "$IMAGE_NAME@$dg" --yes || true
            done
          fi

      - name: Create/Update Container App
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"

          if ! az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" >/dev/null 2>&1; then
            az containerapp create -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
              --environment "$CONTAINERAPPS_ENV" --ingress external --target-port 8000 \
              --image "$PLACEHOLDER" --system-assigned --env-vars OPENAI_MODEL="$OPENAI_MODEL"
          fi

          az containerapp registry set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
            --server "$ACR_NAME.azurecr.io" --identity system

          ACR_ID=$(az acr show -g "$AZURE_RESOURCE_GROUP" -n "$ACR_NAME" --query id -o tsv)
          APP_PID=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --query identity.principalId -o tsv)
          az role assignment create --assignee "$APP_PID" --role AcrPull --scope "$ACR_ID" >/dev/null 2>&1 || true

          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
            --image "$IMAGE" --set-env-vars OPENAI_MODEL="$OPENAI_MODEL"

          az containerapp secret set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --secrets openai-key="$OPENAI_API_KEY"
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" --set-env-vars OPENAI_API_KEY=secretref:openai-key
