name: Deploy API (Container Apps)
ACR_NAME: lcswaacr
CONTAINERAPPS_ENV: lc-swa-env
CONTAINERAPP_NAME: lc-swa-api
IMAGE_NAME: lc-swa-api


jobs:
deploy:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4


- name: Azure Login
uses: azure/login@v2
with:
creds: ${{ secrets.AZURE_CREDENTIALS }}


- name: Create RG
run: az group create -n $AZURE_RESOURCE_GROUP -l $AZURE_LOCATION


- name: Create ACR
run: az acr create -g $AZURE_RESOURCE_GROUP -n $ACR_NAME --sku Basic --only-show-errors || true


- name: ACR Login
uses: azure/acr-login@v1
with:
acr-name: ${{ env.ACR_NAME }}


- name: Build & Push Image
uses: docker/build-push-action@v5
with:
context: ./api
push: true
tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest


- name: Create Container Apps env
run: |
az extension add --name containerapp --upgrade
az provider register --namespace Microsoft.App --wait
az containerapp env create -g $AZURE_RESOURCE_GROUP -n $CONTAINERAPPS_ENV -l $AZURE_LOCATION || true


- name: Create/Update API app
run: |
API_FQDN=$(az containerapp show -g $AZURE_RESOURCE_GROUP -n $CONTAINERAPP_NAME --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
if [ -z "$API_FQDN" ]; then
az containerapp create -g $AZURE_RESOURCE_GROUP -n $CONTAINERAPP_NAME \
--environment $CONTAINERAPPS_ENV --ingress external --target-port 8000 \
--image $ACR_NAME.azurecr.io/$IMAGE_NAME:latest \
--env-vars OPENAI_MODEL=gpt-4o-mini ALLOWED_ORIGIN=${{ secrets.SWA_URL || '*' }} \
--secrets openai-key=${{ secrets.OPENAI_API_KEY }} \
--secret-env-vars OPENAI_API_KEY=secretref:openai-key
else
az containerapp update -g $AZURE_RESOURCE_GROUP -n $CONTAINERAPP_NAME \
--image $ACR_NAME.azurecr.io/$IMAGE_NAME:latest \
--set-env-vars OPENAI_MODEL=gpt-4o-mini ALLOWED_ORIGIN=${{ secrets.SWA_URL || '*' }} \
--secrets openai-key=${{ secrets.OPENAI_API_KEY }} \
--replace-secrets
fi


- name: Output API URL
id: api
run: |
FQDN=$(az containerapp show -g $AZURE_RESOURCE_GROUP -n $CONTAINERAPP_NAME --query properties.configuration.ingress.fqdn -o tsv)
echo "api_url=https://$FQDN" >> $GITHUB_OUTPUT


- name: Share API URL to repo env
uses: actions/github-script@v7
with:
script: |
core.exportVariable('API_BASE_URL', '${{ steps.api.outputs.api_url }}')