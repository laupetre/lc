name: Infra Apply (reusable)

on:
  workflow_call:
    inputs:
      tf_dir:
        description: 'Path to the Terraform root directory'
        required: false
        type: string
        default: infra

      # Backend (tfstate) settings
      backend_rg:
        required: true
        type: string
      backend_sa:
        required: true
        type: string
      backend_container:
        required: true
        type: string
      backend_key:
        required: true
        type: string

      # Infra resource names (used for idempotent imports)
      rg_name:
        required: true
        type: string
      env_name:
        required: true
        type: string
      acr_name:
        required: true
        type: string
      law_name:
        required: true
        type: string
      swa_name:
        required: true
        type: string
      app_name:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  plan_apply:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt (write to avoid exit code 3)
        working-directory: ${{ inputs.tf_dir }}
        run: terraform fmt -recursive

      - name: Terraform Init (azurerm backend)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=${{ inputs.backend_rg }}" \
            -backend-config="storage_account_name=${{ inputs.backend_sa }}" \
            -backend-config="container_name=${{ inputs.backend_container }}" \
            -backend-config="key=${{ inputs.backend_key }}"

      # -------------------------
      # Idempotent imports (extension-free; guarded)
      # -------------------------

      - name: Import Resource Group into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        env:
          RG: ${{ inputs.rg_name }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q '^azurerm_resource_group\.rg$'; then
            if az group show -n "$RG" --query id -o tsv >/dev/null 2>&1; then
              terraform import -no-color azurerm_resource_group.rg \
                "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RG}" || true
            fi
          fi

      - name: Import ACR into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        env:
          RG:  ${{ inputs.rg_name }}
          ACR: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q '^azurerm_container_registry\.acr$'; then
            if ID=$(az resource show -g "$RG" -n "$ACR" \
                  --resource-type Microsoft.ContainerRegistry/registries \
                  --query id -o tsv 2>/dev/null); then
              terraform import -no-color azurerm_container_registry.acr "$ID" || true
            fi
          fi

      - name: Import Log Analytics into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        env:
          RG:  ${{ inputs.rg_name }}
          LAW: ${{ inputs.law_name }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q '^azurerm_log_analytics_workspace\.law$'; then
            if ID=$(az resource show -g "$RG" -n "$LAW" \
                  --resource-type Microsoft.OperationalInsights/workspaces \
                  --query id -o tsv 2>/dev/null); then
              terraform import -no-color azurerm_log_analytics_workspace.law "$ID" || true
            fi
          fi

      - name: Import ACA Environment into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        env:
          RG:       ${{ inputs.rg_name }}
          ENV_NAME: ${{ inputs.env_name }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q '^azurerm_container_app_environment\.env$'; then
            if ID=$(az resource show -g "$RG" -n "$ENV_NAME" \
                  --resource-type Microsoft.App/managedEnvironments \
                  --query id -o tsv 2>/dev/null); then
              terraform import -no-color azurerm_container_app_environment.env "$ID" || true
            fi
          fi

      - name: Import Static Web App into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        env:
          RG:  ${{ inputs.rg_name }}
          SWA: ${{ inputs.swa_name }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q '^azurerm_static_web_app\.swa$'; then
            if ID=$(az resource show -g "$RG" -n "$SWA" \
                  --resource-type Microsoft.Web/staticSites \
                  --query id -o tsv 2>/dev/null); then
              terraform import -no-color azurerm_static_web_app.swa "$ID" || true
            fi
          fi

      - name: Import Container App into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        env:
          RG:  ${{ inputs.rg_name }}
          APP: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q '^azurerm_container_app\.api$'; then
            if ID=$(az resource show -g "$RG" -n "$APP" \
                  --resource-type Microsoft.App/containerApps \
                  --query id -o tsv 2>/dev/null); then
              terraform import -no-color azurerm_container_app.api "$ID" || true
            fi
          fi

      - name: Terraform Plan
        working-directory: ${{ inputs.tf_dir }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ inputs.tf_dir }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Expose infra outputs to caller
        id: expose
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          OUT_JSON="$(terraform output -json)"
          api_url="$(jq -r '.api_url.value // empty' <<<"$OUT_JSON")"
          api_hostname="$(jq -r '.api_hostname.value // empty' <<<"$OUT_JSON")"
          acr_login_server="$(jq -r '.acr_login_server.value // empty' <<<"$OUT_JSON")"
          swa_token="$(jq -r '.swa_token.value // empty' <<<"$OUT_JSON")"
          if [ -n "$swa_token" ]; then echo "::add-mask::$swa_token"; fi
          {
            echo "api_url=$api_url"
            echo "api_hostname=$api_hostname"
            echo "acr_login_server=$acr_login_server"
            echo "swa_token=$swa_token"
          } >> "$GITHUB_OUTPUT"
