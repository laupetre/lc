name: Infra Apply

on:
  workflow_call:
    inputs:
      tf_dir:
        type: string
        description: Path to the Terraform root (e.g. infra)
        required: true
      rg_name:
        type: string
        description: Azure Resource Group name (e.g. lc-swa-rg)
        required: true
      app_name:
        type: string
        description: Container App name (e.g. lc-swa-api)
        required: true
      location:
        type: string
        description: Azure region for new resources (e.g. eastus2)
        required: true
      tfstate_rg:
        type: string
        description: Resource Group where the tfstate storage account lives (e.g. tfstate-rg)
        required: true
      tfstate_sa:
        type: string
        description: Storage Account name for tfstate (e.g. tfstatelaupetrelc)
        required: true
      tfstate_container:
        type: string
        description: Blob container for tfstate (e.g. tfstate)
        required: true
      tfstate_key:
        type: string
        description: Blob name for tfstate (e.g. prod.terraform.tfstate)
        required: true
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true

jobs:
  apply:
    name: Terraform Apply (with safe imports)
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}

      # Backend config
      TFSTATE_RG:         ${{ inputs.tfstate_rg }}
      TFSTATE_SA:         ${{ inputs.tfstate_sa }}
      TFSTATE_CONTAINER:  ${{ inputs.tfstate_container }}
      TFSTATE_KEY:        ${{ inputs.tfstate_key }}

      # Infra inputs
      RG_NAME:            ${{ inputs.rg_name }}
      APP_NAME:           ${{ inputs.app_name }}
      LOCATION:           ${{ inputs.location }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          client-id:     ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init (azurerm backend)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${TFSTATE_SA}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}"

      ######################################################################
      # Idempotent imports for existing resources we might already have
      ######################################################################

      - name: Import Resource Group into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          if az group show -n "${RG_NAME}" >/dev/null 2>&1; then
            terraform import -no-color azurerm_resource_group.rg "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}" || true
          fi

      - name: Import Container Registry into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          ACR_NAME="$(terraform output -raw acr_name 2>/dev/null || true)"
          if [ -z "${ACR_NAME}" ]; then
            # Fall back to querying by tag or naming convention if your TF doesn't output this.
            # If your TF has a fixed name in variables, you can also read it with:
            # ACR_NAME="$(terraform console <<< 'var.acr_name' 2>/dev/null | tr -d '\r')"
            ACR_NAME="$(az acr list --resource-group "${RG_NAME}" --query "[0].name" -o tsv 2>/dev/null || true)"
          fi

          if [ -n "${ACR_NAME}" ]; then
            ACR_ID="$(az acr show -n "${ACR_NAME}" -g "${RG_NAME}" --query id -o tsv 2>/dev/null || true)"
            if [ -n "${ACR_ID}" ]; then
              terraform import -no-color azurerm_container_registry.acr "${ACR_ID}" || true
            fi
          fi

      - name: Import Log Analytics Workspace into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          LAW_NAME="$(terraform output -raw law_name 2>/dev/null || true)"
          if [ -z "${LAW_NAME}" ]; then
            LAW_NAME="$(az monitor log-analytics workspace list -g "${RG_NAME}" --query "[0].name" -o tsv 2>/dev/null || true)"
          fi

          if [ -n "${LAW_NAME}" ];
