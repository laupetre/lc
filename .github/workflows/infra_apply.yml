name: Provision Azure infra (Terraform)

on:
  workflow_call:
    inputs:
      tf_dir:
        required: false
        type: string
        default: "infra"
    outputs:
      api_url:
        description: "Public URL of the Container App"
        value: ${{ jobs.plan-apply.outputs.api_url }}
      api_hostname:
        description: "FQDN of the Container App"
        value: ${{ jobs.plan-apply.outputs.api_hostname }}
      swa_token:
        description: "SWA deployment token"
        value: ${{ jobs.plan-apply.outputs.swa_token }}

  workflow_dispatch:
    inputs:
      tf_dir:
        description: "Terraform folder"
        required: false
        default: "infra"
        type: string

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  LOCATION: eastus

  # Remote state config
  TFSTATE_RG: tfstate-rg
  TFSTATE_SA: tfstate-${{ github.repository_owner }}-${{ github.event.repository.name }}
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: prod.terraform.tfstate

  # Must match infra/variables.tf (or override via TF_VARs)
  RG_NAME: lc-swa-rg
  CONTAINERAPP_NAME: lc-swa-api

jobs:
  plan-apply:
    name: Terraform plan & apply
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      api_url: ${{ steps.expose.outputs.api_url }}
      api_hostname: ${{ steps.expose.outputs.api_hostname }}
      swa_token: ${{ steps.expose.outputs.swa_token }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Service Principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Export ARM_* env for Terraform
        shell: bash
        run: |
          set -euo pipefail
          cat > sp.json <<'JSON'
          ${{ secrets.AZURE_CREDENTIALS }}
          JSON
          echo "ARM_CLIENT_ID=$(jq -r '.clientId' sp.json)"             >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(jq -r '.clientSecret' sp.json)"     >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(jq -r '.tenantId' sp.json)"             >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(jq -r '.subscriptionId' sp.json)" >> $GITHUB_ENV
          echo "::add-mask::$(jq -r '.clientSecret' sp.json)"

      # ⬇️ Only change: v3 → v2 to avoid AggregateError
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: Ensure tfstate backend (RG/SA) + fetch key
        shell: bash
        run: |
          set -euo pipefail
          SA_RAW="${TFSTATE_SA,,}"
          SA_RAW="${SA_RAW//[^a-z0-9]/}"
          SA_TRUNC="${SA_RAW:0:24}"
          echo "SANITIZED_SA=${SA_TRUNC}" >> $GITHUB_ENV

          az group create -n "${TFSTATE_RG}" -l "${LOCATION}" 1>/dev/null

          if ! az storage account show -g "${TFSTATE_RG}" -n "${SA_TRUNC}" >/dev/null 2>&1; then
            az storage account create \
              -g "${TFSTATE_RG}" -n "${SA_TRUNC}" -l "${LOCATION}" \
              --sku Standard_LRS --kind StorageV2 \
              --allow-shared-key-access true 1>/dev/null
          else
            az storage account update \
              -g "${TFSTATE_RG}" -n "${SA_TRUNC}" \
              --allow-shared-key-access true 1>/dev/null || true
          fi

          KEY=$(az storage account keys list -g "${TFSTATE_RG}" -n "${SA_TRUNC}" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          echo "ARM_ACCESS_KEY=$KEY" >> $GITHUB_ENV

      - name: Ensure tfstate container exists (data-plane)
        shell: bash
        env:
          ACCOUNT:   ${{ env.SANITIZED_SA }}
          CONTAINER: ${{ env.TFSTATE_CONTAINER }}
          KEY:       ${{ env.ARM_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for i in {1..30}; do
            EXISTS=$(az storage container exists \
                       --account-name "$ACCOUNT" \
                       --name "$CONTAINER" \
                       --auth-mode key \
                       --account-key "$KEY" \
                       --query exists -o tsv 2>/dev/null || echo false)
            if [ "$EXISTS" = "true" ]; then break; fi
            az storage container create \
              --account-name "$ACCOUNT" \
              --name "$CONTAINER" \
              --auth-mode key \
              --account-key "$KEY" 1>/dev/null || true
            sleep 5
          done

      - name: Terraform init (shared-key backend)
        working-directory: ${{ inputs.tf_dir }}
        env:
          ARM_ACCESS_KEY: ${{ env.ARM_ACCESS_KEY }}
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${SANITIZED_SA}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="access_key=${ARM_ACCESS_KEY}"

      - name: Import existing Resource Group into state (if present)
        working-directory: ${{ inputs.tf_dir }}
        env:
          SUBSCRIPTION_ID: ${{ env.ARM_SUBSCRIPTION_ID }}
          RG:              ${{ env.RG_NAME }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if az group show -n "$RG" >/dev/null 2>&1; then
            if ! terraform state list | grep -q '^azurerm_resource_group\.rg$'; then
              ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}"
              terraform import -input=false azurerm_resource_group.rg "$ID"
            fi
          fi

      - name: Import existing Container App into state (if present)
        working-directory: ${{ inputs.tf_dir }}
        env:
          SUBSCRIPTION_ID: ${{ env.ARM_SUBSCRIPTION_ID }}
          RG:              ${{ env.RG_NAME }}
          APP:             ${{ env.CONTAINERAPP_NAME }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if az containerapp show -g "$RG" -n "$APP" >/dev/null 2>&1; then
            if ! terraform state list | grep -q '^azurerm_container_app\.api$'; then
              ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.App/containerApps/${APP}"
              terraform import -input=false azurerm_container_app.api "$ID"
            fi
          fi

      - name: Terraform fmt (auto-fix)
        working-directory: ${{ inputs.tf_dir }}
        run: terraform fmt -recursive

      - name: Terraform fmt (verify)
        working-directory: ${{ inputs.tf_dir }}
        run: terraform fmt -recursive -check -diff

      - name: Terraform validate
        working-directory: ${{ inputs.tf_dir }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ inputs.tf_dir }}
        env:
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ inputs.tf_dir }}
        env:
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Expose infra outputs to caller
        id: expose
        working-directory: ${{ inputs.tf_dir }}
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "api_hostname=$(terraform output -raw api_hostname)" >> $GITHUB_OUTPUT
          SWA_TOKEN=$(terraform output -raw swa_token)
          echo "::add-mask::$SWA_TOKEN"
          echo "swa_token=$SWA_TOKEN" >> $GITHUB_OUTPUT
