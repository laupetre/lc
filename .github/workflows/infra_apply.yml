name: Apply Infra

on:
  workflow_call:
    inputs:
      tf_dir:
        description: Path to the Terraform directory
        type: string
        default: infra
      cleanup_level:
        description: Cleanup mode (none|soft|hard)
        type: string
        default: none
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      OPENAI_API_KEY:
        required: false

  workflow_dispatch:
    inputs:
      tf_dir:
        description: Path to the Terraform directory
        type: string
        default: infra
      cleanup_level:
        description: Cleanup mode (none|soft|hard)
        type: choice
        options: [none, soft, hard]
        default: none

  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra_apply.yml'

concurrency:
  group: prod-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Export common env
        run: |
          set -euo pipefail
          echo "AZURE_RESOURCE_GROUP=lc-swa-rg"    >> $GITHUB_ENV
          echo "CONTAINERAPPS_ENV_NAME=lc-swa-env" >> $GITHUB_ENV

      - name: Ensure tfstate backend (RG/SA) + fetch key
        id: tfstate
        run: |
          set -euo pipefail
          RG_NAME="tfstate-rg"
          SA_NAME="tfstatelaupetrelc"
          CONTAINER="tfstate"
          KEY="prod.terraform.tfstate"
          LOCATION="eastus"

          az group create -n "$RG_NAME" -l "$LOCATION" >/dev/null
          if ! az storage account show -n "$SA_NAME" -g "$RG_NAME" >/dev/null 2>&1; then
            az storage account create -n "$SA_NAME" -g "$RG_NAME" -l "$LOCATION" --sku Standard_LRS >/dev/null
          fi
          export AZ_SA_KEY="$(az storage account keys list -g "$RG_NAME" -n "$SA_NAME" --query '[0].value' -o tsv)"
          if ! az storage container show --account-name "$SA_NAME" --account-key "$AZ_SA_KEY" -n "$CONTAINER" >/dev/null 2>&1; then
            az storage container create --account-name "$SA_NAME" --account-key "$AZ_SA_KEY" -n "$CONTAINER" >/dev/null
          fi

          echo "TF_STATE_RG=$RG_NAME"           >> $GITHUB_ENV
          echo "TF_STATE_SA=$SA_NAME"           >> $GITHUB_ENV
          echo "TF_STATE_CONTAINER=$CONTAINER"  >> $GITHUB_ENV
          echo "TF_STATE_KEY=$KEY"              >> $GITHUB_ENV

      - name: Terraform Init (azurerm backend)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${TF_STATE_RG}" \
            -backend-config="storage_account_name=${TF_STATE_SA}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Import ACA Environment (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          ENV_ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${CONTAINERAPPS_ENV_NAME}"
          if ! terraform state show azurerm_container_app_environment.env >/dev/null 2>&1; then
            terraform import azurerm_container_app_environment.env "$ENV_ID" || true
          fi

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.tf_dir }}
        env:
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          terraform fmt -check
          terraform validate
          terraform plan -out tfplan

      - name: Terraform Apply
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan

      - name: Expose infra outputs to caller
        id: expose
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          OUT_JSON="$(terraform output -json)"
          api_url="$(jq -r '.api_url.value' <<<"$OUT_JSON")"
          api_hostname="$(jq -r '.api_hostname.value' <<<"$OUT_JSON")"
          acr_login_server="$(jq -r '.acr_login_server.value' <<<"$OUT_JSON")"
          swa_token="$(jq -r '.swa_token.value' <<<"$OUT_JSON")"
          echo "::add-mask::$swa_token"
          {
            echo "api_url=$api_url"
            echo "api_hostname=$api_hostname"
            echo "acr_login_server=$acr_login_server"
            echo "swa_token=$swa_token"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "API URL:       ${{ steps.expose.outputs.api_url }}"
          echo "API Hostname:  ${{ steps.expose.outputs.api_hostname }}"
          echo "ACR:           ${{ steps.expose.outputs.acr_login_server }}"
          echo "SWA token len: ${#${{ steps.expose.outputs.swa_token }}}"
