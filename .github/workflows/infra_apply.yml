name: Apply Infra (Terraform)

on:
  workflow_call:
    inputs:
      tf_dir:
        description: Path to Terraform code
        type: string
        required: false
        default: infra
      location:
        description: Azure location for infra and tfstate
        type: string
        required: false
        default: eastus
      # Remote state (shared key)
      tfstate_rg:
        description: Resource group for tfstate storage account
        type: string
        required: false
        default: tfstate-rg
      tfstate_sa:
        description: Storage account name for tfstate
        type: string
        required: false
        default: tfstatelaupetrelc
      tfstate_container:
        description: Blob container for tfstate
        type: string
        required: false
        default: tfstate
      tfstate_key:
        description: Blob key (file name) for tfstate
        type: string
        required: false
        default: prod.terraform.tfstate
      # Managed resource names (used by the auto-import step)
      rg_name:
        description: Resource group containing the infra
        type: string
        required: false
        default: lc-swa-rg
      acr_name:
        description: Azure Container Registry name
        type: string
        required: false
        default: lcacrio
      law_name:
        description: Log Analytics Workspace name
        type: string
        required: false
        default: lc-swa-rg-law
      swa_name:
        description: Static Web App name
        type: string
        required: false
        default: lc-swa-web
    outputs:
      api_url:
        value: ${{ jobs.apply.outputs.api_url }}
      api_hostname:
        value: ${{ jobs.apply.outputs.api_hostname }}
      acr_login_server:
        value: ${{ jobs.apply.outputs.acr_login_server }}
      swa_token:
        value: ${{ jobs.apply.outputs.swa_token }}

permissions:
  contents: read

jobs:
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest

    outputs:
      api_url:          ${{ steps.expose.outputs.api_url }}
      api_hostname:     ${{ steps.expose.outputs.api_hostname }}
      acr_login_server: ${{ steps.expose.outputs.acr_login_server }}
      swa_token:        ${{ steps.expose.outputs.swa_token }}

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: 0

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Service Principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Ensure tfstate backend (RG/SA) + fetch key
        id: backend
        run: |
          set -euo pipefail
          RG="${{ inputs.tfstate_rg }}"
          SA="${{ inputs.tfstate_sa }}"
          CONTAINER="${{ inputs.tfstate_container }}"
          LOC="${{ inputs.location }}"

          az group create -n "$RG" -l "$LOC" >/dev/null

          if ! az storage account show -g "$RG" -n "$SA" >/dev/null 2>&1; then
            az storage account create \
              -g "$RG" -n "$SA" -l "$LOC" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --https-only true \
              >/dev/null
          fi

          KEY="$(az storage account keys list -g "$RG" -n "$SA" --query '[0].value' -o tsv)"
          echo "::add-mask::$KEY"
          echo "sa_key=$KEY" >> "$GITHUB_OUTPUT"

          az storage container create \
            --name "$CONTAINER" \
            --account-name "$SA" \
            --account-key "$KEY" \
            >/dev/null
        shell: bash

      - name: Terraform init (shared-key backend)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=${{ inputs.tfstate_rg }}" \
            -backend-config="storage_account_name=${{ inputs.tfstate_sa }}" \
            -backend-config="container_name=${{ inputs.tfstate_container }}" \
            -backend-config="key=${{ inputs.tfstate_key }}" \
            -backend-config="access_key=${{ steps.backend.outputs.sa_key }}"
        shell: bash

      # Auto-fix formatting to avoid failing the build on fmt differences
      - name: Terraform fmt (auto-fix)
        working-directory: ${{ inputs.tf_dir }}
        run: terraform fmt -recursive

      - name: Terraform validate
        working-directory: ${{ inputs.tf_dir }}
        run: terraform validate

      # Auto-import resources if they already exist in Azure but not in state
      - name: Import existing resources into state (idempotent)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail

          SUB_ID="$(az account show --query id -o tsv)"
          RG="${{ inputs.rg_name }}"
          ACR_NAME="${{ inputs.acr_name }}"
          LAW_NAME="${{ inputs.law_name }}"
          SWA_NAME="${{ inputs.swa_name }}"

          import_if_missing() {
            local addr="$1"
            local id="$2"
            if terraform state show "$addr" >/dev/null 2>&1; then
              echo "State already contains $addr"
            else
              echo "Importing $addr -> $id"
              terraform import "$addr" "$id"
            fi
          }

          import_if_missing \
            azurerm_container_registry.acr \
            "/subscriptions/${SUB_ID}/resourceGroups/${RG}/providers/Microsoft.ContainerRegistry/registries/${ACR_NAME}"

          import_if_missing \
            azurerm_log_analytics_workspace.law \
            "/subscriptions/${SUB_ID}/resourceGroups/${RG}/providers/Microsoft.OperationalInsights/workspaces/${LAW_NAME}"

          import_if_missing \
            azurerm_static_web_app.swa \
            "/subscriptions/${SUB_ID}/resourceGroups/${RG}/providers/Microsoft.Web/staticSites/${SWA_NAME}"

      - name: Terraform plan
        id: plan
        working-directory: ${{ inputs.tf_dir }}
        run: terraform plan -input=false -out tfplan

      - name: Terraform apply
        working-directory: ${{ inputs.tf_dir }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Expose infra outputs to caller
        id: expose
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -euo pipefail
          OUT_JSON="$(terraform output -json)"

          api_url="$(jq -r '.api_url.value' <<<"$OUT_JSON")"
          api_hostname="$(jq -r '.api_hostname.value' <<<"$OUT_JSON")"
          acr_login_server="$(jq -r '.acr_login_server.value' <<<"$OUT_JSON")"
          swa_token="$(jq -r '.swa_token.value' <<<"$OUT_JSON")"

          echo "::add-mask::$swa_token"

          {
            echo "api_url=$api_url"
            echo "api_hostname=$api_hostname"
            echo "acr_login_server=$acr_login_server"
            echo "swa_token=$swa_token"
          } >> "$GITHUB_OUTPUT"
