name: Reusable Deploy Env

on:
  workflow_call:
    inputs:
      location:
        required: true
        type: string
      swa_location:
        required: true
        type: string
      resource_group_name:
        required: true
        type: string
      acr_name:
        required: true
        type: string
      containerapps_env_name:
        required: true
        type: string
      containerapp_name:
        required: true
        type: string
      container_port:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      bootstrap_image:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ""
      ARM_TENANT_ID: ""
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      LOCATION: ${{ inputs.location }}
      SWA_LOCATION: ${{ inputs.swa_location }}
      RG_NAME: ${{ inputs.resource_group_name }}
      ACR_NAME: ${{ inputs.acr_name }}
      ACR_LOGIN_SERVER: ${{ inputs.acr_name }}.azurecr.io
      CA_ENV_NAME: ${{ inputs.containerapps_env_name }}
      CA_NAME: ${{ inputs.containerapp_name }}
      CONTAINER_PORT: ${{ inputs.container_port }}
      IMAGE_NAME: ${{ inputs.image_name }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      BOOTSTRAP_IMAGE: ${{ inputs.bootstrap_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login to Azure (supports classic secret JSON)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: terraform init

      # Idempotent imports for pre-existing resources that caused your errors
      - name: Import existing Azure resources if missing in state
        shell: bash
        run: |
          set -euo pipefail
          sub="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          rg="${RG_NAME}"
          acr="${ACR_NAME}"
          law="${RG_NAME}-law"
          swa="lc-swa-web"

          # ACR
          terraform state show azurerm_container_registry.acr >/dev/null 2>&1 || \
            terraform import azurerm_container_registry.acr \
            "/subscriptions/${sub}/resourceGroups/${rg}/providers/Microsoft.ContainerRegistry/registries/${acr}"

          # Log Analytics Workspace
          terraform state show azurerm_log_analytics_workspace.law >/dev/null 2>&1 || \
            terraform import azurerm_log_analytics_workspace.law \
            "/subscriptions/${sub}/resourceGroups/${rg}/providers/Microsoft.OperationalInsights/workspaces/${law}"

          # Static Web App
          terraform state show azurerm_static_web_app.swa >/dev/null 2>&1 || \
            terraform import azurerm_static_web_app.swa \
            "/subscriptions/${sub}/resourceGroups/${rg}/providers/Microsoft.Web/staticSites/${swa}"

      - name: Azure CLI - Ensure ACR exists (optional guard)
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az acr show -n "${ACR_NAME}" -g "${RG_NAME}" >/dev/null

      - name: Azure ACR Login
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          # docker-login action with azure/login OIDC uses az acr login under the hood

      - name: Build & Push image to ACR
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="location=${LOCATION}" \
            -var="swa_location=${SWA_LOCATION}" \
            -var="resource_group_name=${RG_NAME}" \
            -var="acr_name=${ACR_NAME}" \
            -var="containerapps_env_name=${CA_ENV_NAME}" \
            -var="containerapp_name=${CA_NAME}" \
            -var="container_port=${CONTAINER_PORT}" \
            -var="image_name=${IMAGE_NAME}" \
            -var="image_tag=${IMAGE_TAG}" \
            -var="bootstrap_image=${BOOTSTRAP_IMAGE}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
