# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Terraform Infra

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read deploy.json (from repo root)
        id: cfg
        run: |
          # workflow defaults set working-directory: infra, so deploy.json lives at ../deploy.json
          RG=$(jq -r .resource_group ../deploy.json)
          LOCATION=$(jq -r .location ../deploy.json)
          echo "RG=$RG" >> $GITHUB_OUTPUT
          echo "LOCATION=$LOCATION" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC or service principal)
        uses: azure/login@v2
        with:
          # Prefer OIDC (no secret) if the Azure AD application + federated credential already exist.
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Initialize Terraform
        run: terraform init -input=false -no-color

      - name: Import existing resource group (if exists)
        continue-on-error: true
        env:
          ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ARM_USE_OIDC: "true"
        run: |
          RG=$(jq -r .resource_group ../deploy.json)
          LOCATION=$(jq -r .location ../deploy.json)
          if az group show -n "$RG" >/dev/null 2>&1; then
            terraform import -var "resource_group_name=$RG" -var "location=$LOCATION" -var "github_org=${{ github.repository_owner }}" -var "github_repo=${{ github.event.repository.name }}" -var "github_branch=${{ github.ref_name }}" -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}" azurerm_resource_group.rg /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RG || true
          else
            echo "Resource group $RG does not exist, will be created by Terraform"
          fi

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ARM_USE_OIDC: "true"
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var "resource_group_name=${{ steps.cfg.outputs.RG }}" \
            -var "location=${{ steps.cfg.outputs.LOCATION }}" \
            -var "github_org=${{ github.repository_owner }}" \
            -var "github_repo=${{ github.event.repository.name }}" \
            -var "github_branch=${{ github.ref_name }}" \
            -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: Apply Terraform (auto-approve)
        env:
          ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ARM_USE_OIDC: "true"
        run: |
          terraform apply -input=false -no-color tfplan

      - name: Output deploy info
        run: |
          cat deploy_info.txt || true
