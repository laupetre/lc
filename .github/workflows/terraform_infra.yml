# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Terraform Infra

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read deploy.json (from repo root)
        id: cfg
        run: |
          # workflow defaults set working-directory: infra, so deploy.json lives at ../deploy.json
          RG=$(jq -r .resource_group ../deploy.json)
          LOCATION=$(jq -r .location ../deploy.json)
          echo "RG=$RG" >> $GITHUB_OUTPUT
          echo "LOCATION=$LOCATION" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC or service principal)
        uses: azure/login@v2
        with:
          # Prefer OIDC (no secret) if the Azure AD application + federated credential already exist.
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Initialize Terraform
        run: terraform init -input=false -no-color

      - name: Import existing resources (if exists)
        continue-on-error: true
        env:
          ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ARM_USE_OIDC: "true"
        run: |
          RG=$(jq -r .resource_group ../deploy.json)
          LOCATION=$(jq -r .location ../deploy.json)
          ACR=$(jq -r .acr_name ../deploy.json)
          SWA=$(jq -r .swa_name ../deploy.json)
          ENV=$(jq -r .containerapps_env ../deploy.json)
          ACA=$(jq -r .aca_name ../deploy.json)
          SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          
          # Common terraform import variables
          TF_VARS="-var resource_group_name=$RG -var location=$LOCATION -var github_org=${{ github.repository_owner }} -var github_repo=${{ github.event.repository.name }} -var github_branch=${{ github.ref_name }} -var openai_api_key=${{ secrets.OPENAI_API_KEY }}"
          
          # Import Resource Group
          if az group show -n "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_resource_group.rg /subscriptions/$SUB_ID/resourceGroups/$RG || true
          fi
          
          # Import Container Registry
          if az acr show -n "$ACR" -g "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_container_registry.acr /subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ContainerRegistry/registries/$ACR || true
          fi
          
          # Import Static Web App
          if az staticwebapp show -n "$SWA" -g "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_static_web_app.swa /subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.Web/staticSites/$SWA || true
          fi
          
          # Import Log Analytics Workspace
          if az monitor log-analytics workspace show -n "${ENV}-logs" -g "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_log_analytics_workspace.env /subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.OperationalInsights/workspaces/${ENV}-logs || true
          fi
          
          # Import User Assigned Identity
          if az identity show -n "${ACA}-mi" -g "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_user_assigned_identity.api /subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${ACA}-mi || true
          fi
          
          # Import Container App Environment (if exists)
          if az containerapp env show -n "$ENV" -g "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_container_app_environment.env /subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/$ENV || true
          fi
          
          # Import Container App (if exists)
          if az containerapp show -n "$ACA" -g "$RG" >/dev/null 2>&1; then
            terraform import $TF_VARS azurerm_container_app.api /subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/$ACA || true
          fi
          
          echo "Finished importing existing resources"

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ARM_USE_OIDC: "true"
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var "resource_group_name=${{ steps.cfg.outputs.RG }}" \
            -var "location=${{ steps.cfg.outputs.LOCATION }}" \
            -var "github_org=${{ github.repository_owner }}" \
            -var "github_repo=${{ github.event.repository.name }}" \
            -var "github_branch=${{ github.ref_name }}" \
            -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}"

      - name: Apply Terraform (auto-approve)
        env:
          ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ARM_USE_OIDC: "true"
        run: |
          terraform apply -input=false -no-color tfplan

      - name: Output deploy info
        run: |
          cat deploy_info.txt || true
