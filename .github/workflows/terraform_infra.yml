name: Terraform Infra

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read deploy.json (from repo root)
        id: cfg
        run: |
          # workflow defaults set working-directory: infra, so deploy.json lives at ../deploy.json
          RG=$(jq -r .resource_group ../deploy.json)
          LOCATION=$(jq -r .location ../deploy.json)
          echo "RG=$RG" >> $GITHUB_OUTPUT
          echo "LOCATION=$LOCATION" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC or service principal)
        uses: azure/login@v2
        with:
          # Prefer OIDC (no secret) if the Azure AD application + federated credential already exist.
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # If you don't have OIDC set up yet, provide a service principal secret as a repo secret
          # named AZURE_CLIENT_SECRET. The action will use service-principal auth when client-secret is present.
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Initialize Terraform
        run: terraform init -input=false -no-color

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var "resource_group_name=${{ steps.cfg.outputs.RG }}" \
            -var "location=${{ steps.cfg.outputs.LOCATION }}" \
            -var "github_org=${{ vars.GITHUB_ORG || github.repository_owner }}" \
            -var "github_repo=${{ vars.GITHUB_REPO || github.event.repository.name }}" \
            -var "github_branch=${{ vars.GITHUB_BRANCH || github.ref_name }}"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Apply Terraform (auto-approve)
        # This workflow will perform the apply in CI. Ensure the repo has the necessary Azure secrets or OIDC
        # configuration so the action can authenticate. If you prefer manual apply, remove this step or guard it
        # with a secret check (TF_AUTO_APPROVE).
        run: |
          terraform apply -input=false -no-color tfplan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Output deploy info
        run: |
          cat deploy_info.txt || true
