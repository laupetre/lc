<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LangChain Chat Assistant</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <header>
        <h1>🤖 LangChain Chat Assistant</h1>
        <p class="subtitle">Powered by OpenAI and LangChain</p>
        <div class="auth-section">
            <span id="user-info"></span>
            <button id="login-btn" class="auth-btn">Login</button>
            <button id="logout-btn" class="auth-btn" style="display: none;">Logout</button>
        </div>
    </header>
    
    <main>
        <div id="chat"></div>
        <div class="row">
            <textarea 
                id="input" 
                placeholder="Type your question here... (Press Enter to send, Shift+Enter for new line)"
                rows="3"
            ></textarea>
            <button id="send" type="button">Send</button>
        </div>
        <p id="status" class="status"></p>
    </main>

    <script src="/config.js"></script>
    <script>
        // Get DOM elements
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const statusEl = document.getElementById('status');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        
        // Authentication helpers
        async function checkAuth() {
            try {
                const response = await fetch('/.auth/me');
                if (response.ok) {
                    const data = await response.json();
                    if (data.clientPrincipal) {
                        // User is authenticated
                        userInfo.textContent = `👤 ${data.clientPrincipal.userDetails}`;
                        loginBtn.style.display = 'none';
                        logoutBtn.style.display = 'inline-block';
                        return true;
                    }
                }
            } catch (error) {
                console.log('Not authenticated');
            }
            // User is not authenticated
            loginBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            return false;
        }
        
        loginBtn.addEventListener('click', () => {
            window.location.href = '/login';
        });
        
        logoutBtn.addEventListener('click', () => {
            window.location.href = '/logout';
        });
        
        // Check auth status on page load
        checkAuth();

        // Escape HTML special characters to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;'
            };
            return text.replace(/[&<>]/g, char => map[char]);
        }

        // Add a message to the chat
        function addMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'msg ' + (role === 'You' ? 'me' : 'bot');
            
            const bubble = `
                <div class="bubble">
                    <div class="role">${role}</div>
                    ${escapeHtml(text)}
                </div>
            `;
            
            messageDiv.innerHTML = bubble;
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        // Send a message to the API
        async function sendMessage() {
            const question = input.value.trim();
            
            // Don't send empty messages
            if (!question) return;
            
            // Clear input and disable send button
            input.value = '';
            send.disabled = true;
            statusEl.textContent = 'Thinking...';
            
            // Add user message to chat
            addMessage('You', question);
            
            try {
                // Call the API
                const response = await fetch(`${window.API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ input: question })
                });
                
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                
                const data = await response.json();
                addMessage('Assistant', data.output || '(no output)');
                
            } catch (error) {
                addMessage('Assistant', 'Error: ' + (error.message || error));
            } finally {
                // Re-enable send button and focus input
                send.disabled = false;
                statusEl.textContent = '';
                input.focus();
            }
        }

        // Event listeners
        send.addEventListener('click', sendMessage);
        
        // Send on Enter, new line on Shift+Enter
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
